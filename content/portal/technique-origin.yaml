techniques:
  T0100:
    summary: Discover naming conventions
    tactic: Reconnaissance
    kind: incident
    note: TXTBOOK reconstructed Tinkoff/T-Bank private package namespaces; Birsan found internal names
      via public docs and DNS. Also plain OWASP recon guidance.
    sources:
    - https://www.cloudsek.com/blog/txtbook-a-supply-chain-heist-rehearsed-in-public
    - https://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/01-Information_Gathering/README
  T0101:
    summary: Discover technology stacks
    tactic: Reconnaissance
    kind: incident
    note: Polyfill.io attackers picked a JS library embedded across hundreds of thousands of sites; dependency-confusion
      operators profile target stacks. Also OWASP recon guidance.
    sources:
    - https://sansec.io/research/polyfill-supply-chain-attack
    - https://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/01-Information_Gathering/README
  T0102:
    summary: Discover used open-source dependencies
    tactic: Reconnaissance
    kind: incident
    note: Birsan dependency confusion and llms.txt unclaimed-package squatting both started by enumerating
      a target’s dependencies. Also OWASP guidance.
    sources:
    - https://safedep.io/defi-infostealer-fake-arbitrage-bot-npm
    - https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
  T0103:
    summary: Scan public artifacts for secrets
    tactic: Reconnaissance
    kind: research
    note: 'Identified in published CI/CD or supply-chain security research cited below. DEF CON 32: CloudQuarry,
      secrets in 3.1 million public AMIs.'
    sources:
    - https://cycode.com/introducing-container-secret-scanning/
    - https://docs.gitlab.com/ee/user/application_security/secret_detection/
    - https://defcon.org/html/defcon-32/dc-32-speakers.html#54518
  T0104:
    summary: Discover coding flaws
