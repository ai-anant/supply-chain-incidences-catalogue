    sources: T0100 naming conventions, T0101 technology stacks, T0104 coding flaws, T0143 external user
    accounts, T0190 weak encryption.'
  - 'Mapped the behaviors onto existing incidents: TXTBOOK/Birsan (T0100), Polyfill.io (T0101), Artifactory
    CVE chain (T0104), @7nohe + prt-scan + hackerbot-claw (T0143), Velora plain-HTTP C2 + SleeperGem VERIFY_NONE
    (T0190).'
  - 'Three techniques had incidents but generic-only refs — incident links added to their origin entries:
    T0102, T0149 (destructive npm wipe), T0164 (arrayref privileged-repo injection).'
  - Zero techniques remain with neither an incident mapping nor a specific source.
- date: '2026-09-25'
  id: fix-nested-anchor-cards
  title: Fixed blank cards on incident/platform lists (nested anchors)
  items:
  - Incident and platform cards were <a> elements containing platform <a> chips. HTML forbids nested anchors,
    so the browser closed each card at its first chip and rendered the remaining chips plus technique
    count as a stray empty anchor — the blank block below every title.
  - Cards are now <div> wrappers with a full-card overlay link; platform chips stay clickable above the
    overlay. Zero nested anchors remain.
