- id: dc34-waf-agent-takeover
  event: DEF CON 34
  title: Your WAF Blocked Us, That Was The Exploit - Remote Agent Takeover via Cloudflare, Sentry and
    Claude
  speakers:
  - Barak Sternberg
  - Nevo Poran
  - Ron Bobrov
  url: https://defcon.org/html/defcon-34/dc-34-speakers.html#content_66668
  field: ai-supply-chain
  techniques:
  - T0210
  note: Payloads in Cloudflare WAF logs and Sentry stack traces are read by agents. Sentry's Seer poisons
    Cursor. Persistence is config poisoning and memory injection ("agentic rootkits"). Claude network-sandbox
    bypass is the exfil step.
- id: dc34-firewallfalcon
  event: DEF CON 34
  title: 'Hacking the Hackers who Hack Hackers: Supply-Chain Backdoors in Underground VPN Infrastructure'
  speakers:
  - Assaf Morag
  url: https://defcon.org/html/defcon-34/dc-34-speakers.html#content_66596
  field: supply-chain
  techniques:
  - T0110
  - T0197
  note: FirewallFalcon is promoted on Telegram as a legitimate open-source VPN/SSH manager and installed
    from outside a vetted registry. It ships backdoors, a rogue TLS root, and DNS hijack. Not a registry
    publish (T0109) and not a commit into someone else's repo (T0138).
- id: dc34-offguard
  event: DEF CON 34
  title: 'OffGuard: Breaking the Most Popular AI Gateway from Auth Bypass to Cloud Compromise'
  speakers:
  - Yaara Shriki
  url: https://defcon.org/html/defcon-34/dc-34-speakers.html#content_66651
  field: ai-supply-chain
  techniques: []
  gap: 'LiteLLM product vulnerabilities: MCP-layer auth bypass, sandbox-escape RCE, SSRF to cloud credentials,
    default credentials on about 1 in 10 instances. No technique names an AI-gateway control plane.
    Not mapped to T0137; weak login is only one finding, not the talk.'
- id: dc34-one-chain
  event: DEF CON 34
  title: One Chain to Own Them All — Breaking AI Infrastructures
  speakers:
  - Ji'an Zhou
  - Lei Lu
  url: https://defcon.org/html/defcon-34/dc-34-speakers.html#content_66609
  field: ai-supply-chain
  techniques: []
  gap: vLLM, ComfyUI, and NVIDIA Dynamo load attacker weights via torch.load (CVE-2026-24747). That is
    a malicious model file executed by an inference API, not a registry publish (T0109) and not a URL
    package install (T0197). No technique for model-weight loading. Vulnerability research, not an incident.
- id: dc34-local-ai-runtimes
  event: DEF CON 34
  title: 'Breaking Local AI Runtimes: Exploiting llama.cpp and Ollama'
  speakers:
  - Ofek Itach
  - Vladimir Tokarev
  url: https://defcon.org/html/defcon-34/dc-34-speakers.html#content_66575
  field: ai-adjacent
  techniques: []
  gap: The abstract says this is not prompt injection. JNI use-after-free, a server race, and a GGUF metadata
    heap read in llama.cpp and Ollama. Product memory corruption, not a supply-chain publish and not T0210.
- id: dc34-data-tomb-raider
  event: DEF CON 34
  title: 'Data Tomb Raider: Raiding Modern AI Vaults with Legacy Flaws for Treasure Stealing'
  speakers:
  - Dolev Taler
  - Mark Vaitsman
  url: https://defcon.org/html/defcon-34/dc-34-speakers.html#content_66592
  field: ai-adjacent
  techniques: []
  gap: One-click parameter-to-prompt against Microsoft 365 Copilot, exfil through Bing. SaaS assistant
    prompt injection, not coding-agent config poison (T0210) and not a package or registry.
