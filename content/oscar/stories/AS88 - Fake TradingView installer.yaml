id: AS88
type: Attack Story
date: 2026-08
platforms:
  - macos
  - update-channel

summary: Fake TradingView macOS installer via YouTube ad
description: |
  SafeDep: a YouTube video ad impersonating TradingView delivered a fake
  .pkg installer. Inside: a self-healing LaunchAgent, an AES-encrypted
  V8 bytecode payload, and a Node.js MITM proxy trusted by a rogue root
  CA. Same class as fake corepack.org (AS61): brandjacked developer-tool
  download, not a registry hijack.

