id: AS5
type: Attack Story
date: 2017-09
platforms:
  - windows
  - workstation
  - update-channel

summary: CCleaner 5.33 signed ShadowPad backdoor
description: |
  In September 2017 Avast/Piriform shipped CCleaner 5.33.6162 with a
  ShadowPad-family backdoor compiled into the legitimate binary and signed
  with Piriform’s real code-signing certificate. Avast’s investigation
  found the initial access was an unattended developer workstation reached
  over TeamViewer; more than 40 machines and the build system were later
  infected. Tens of millions of downloads occurred before the poisoned
  version was replaced. Talos and Avast published the technical follow-up.

attacks:
  - attack: Piriform / Avast build
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0153
        techName: Compromised developer workstation
        tactic: Initial Access
        comment: Unattended developer workstation accessed via TeamViewer.
      - techniqueID: T0113
        techName: Compromised user account
        tactic: Initial Access
        comment: TeamViewer credentials reused from another breach.
      - techniqueID: T0137
        techName: Weak authentication methods
        tactic: Initial Access
        comment: No MFA on the remote-access path.
      - techniqueID: T0176
        techName: Disable or misconfigure security measures
        tactic: Defense Evasion
        comment: Dozens of workstations and the build system were infected without stopping the release.
      - techniqueID: T0191
        techName: Malicious code in artifacts
        tactic: Impact
        comment: Custom ShadowPad built into the CCleaner installer.
      - techniqueID: T0208
        techName: Compromise code-signing identity
        tactic: Defense Evasion
        comment: The backdoored binary was signed with Piriform’s legitimate certificate.
  - attack: CCleaner users
    index: 2
    stage: post-supply-chain
    customer: 1
    supplier: 0
    techniques:
      - techniqueID: T0172
        techName: Runtime backdoor
        tactic: Execution
        comment: ShadowPad allowed further modules and data theft on victim PCs.
      - techniqueID: T0201
        techName: Customers compromised
        tactic: Impact
        comment: Multi-million download blast radius before the version was pulled.

links:
  - https://blog.avast.com/update-ccleaner-attackers-entered-via-teamviewer
  - https://blog.talosintelligence.com/avast-distributes-backdoored-ccleaner/
