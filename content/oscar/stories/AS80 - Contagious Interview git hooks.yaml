summary: Contagious Interview stage-2 in Git pre-commit / post-checkout hooks
description: |
  OSM found Lazarus Contagious Interview / TasksJacker lures moving the
  stage-2 loader out of .vscode/tasks.json into .githooks/pre-commit
  (and post-checkout). The hook fingerprints uname -s and pipes a curl
  from precommit.vercel.app into sh or cmd, always exiting 0 so the
  commit looks fine. Same fake-recruiter coding-assessment social
  engineering as AS41, earlier in the workflow — fires when the
  candidate commits, and post-checkout fires on every branch switch.
  Identical blob SHA seen across several DeFi-themed lure repos.

