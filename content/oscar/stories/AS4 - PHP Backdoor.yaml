id: AS4
type: Attack Story
date: 2021-03
platforms:
  - packagist
  - git

summary: php.net git server Zerodium backdoor
description: |
  On 28 March 2021 two malicious commits landed on git.php.net impersonating
  PHP developers. The change would execute attacker-supplied code if the
  HTTP User-Agent started with "zerodium". The official php.net news post
  said the malicious commits were caught before they reached end-user
  releases. PHP paused releases, enabled MFA, and later moved canonical
  development to GitHub. The inherited text wrongly dated this to 2023.

attacks:
  - attack: git.php.net
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0180
        techName: Compromise services / servers
        tactic: Initial Access
        comment: The self-hosted PHP git server was the point of injection.
      - techniqueID: T0195
        techName: Spoofed commits
        tactic: Defense Evasion
        comment: Commits impersonated two PHP developers.
      - techniqueID: T0137
        techName: Weak authentication methods
        tactic: Initial Access
        comment: Post-incident action was to require MFA; git.php.net was retired.
      - techniqueID: T0111
        techName: Malicious code contribution to an open-source repository
        tactic: Resource Development
        comment: Backdoor committed into php-src.
      - techniqueID: T0191
        techName: Malicious code in artifacts
        tactic: Impact
        comment: Intended to ship in official PHP tarballs; caught before release.
  - attack: PHP users (if it had shipped)
    index: 2
    stage: post-supply-chain
    customer: 1
    supplier: 0
    techniques:
      - techniqueID: T0172
        techName: Runtime backdoor
        tactic: Execution
        comment: User-Agent zerodium would have run attacker commands on every PHP server.

links:
  - https://news-web.php.net/php.internals/113838
  - https://www.php.net/archive/2021.php
