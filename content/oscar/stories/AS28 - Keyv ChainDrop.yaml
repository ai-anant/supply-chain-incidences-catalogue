id: AS28
type: Attack Story
date: 2026-08
platforms:
  - npm
  - github-actions
  - workstation
  - ai-agents
  - kubernetes

summary: Keyv / Cacheable ChainDrop worm
description: |
  Maintainer Jared Wray's postmortem of the ChainDrop/Shai-Hulud wave on
  keyv and cacheable. A leftover full-access GitHub PAT on an infected
  developer machine pushed poisoned commits; the projects' own GitHub
  Actions plus npm OIDC trusted publishing released them. Poisoned packages
  therefore carried genuine SLSA/valid provenance. Provenance proved which
  commit was built, not that the commit was authorized. First-wave payload
  was a preinstall hook dropping a Bun second stage that harvested
  npm/GitHub/AWS/Kubernetes/Vault credentials. About 444 package names /
  2,212 versions in roughly four hours.

attacks:
  - attack: Maintainer machine and release workflow
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0153
        techName: Compromised developer workstation
        tactic: Initial Access
        comment: Infected laptop held a stale full-access GitHub PAT.
      - techniqueID: T0112
        techName: Compromised token
        tactic: Initial Access
        comment: The leftover PAT pushed poisoned commits to keyv/cacheable.
      - techniqueID: T0166
        techName: Trigger pipeline execution
        tactic: Execution
        comment: The project's own release workflow published the poison.
      - techniqueID: T0202
        techName: Inadequate CI/CD workflow permissions
        tactic: Persistence
        comment: OIDC trusted publishing with write-capable automation.
      - techniqueID: T0206
        techName: Forge or omit build provenance
        tactic: Defense Evasion
        comment: |
          Provenance was real and valid — and still described a malicious
          commit. Presence of SLSA did not mean the commit was authorized.
      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: Hundreds of package names published in hours.
      - techniqueID: T0151
        techName: Installation scripts
        tactic: Execution
        comment: preinstall downloaded a Bun second-stage harvester.
      - techniqueID: T0140
        techName: Harvest tokens from environment variables
        tactic: Credential Access
        comment: npm, GitHub, AWS, Kubernetes, and Vault creds.

gaps: []

