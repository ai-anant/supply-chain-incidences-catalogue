summary: Polymarket fake-bot and wallet-key npm campaign
description: |
  SafeDep documented a Polymarket-themed npm campaign in several posts:
  a GitHub “arbitrage bot” (53 forks) with a malicious npm dependency;
  nine packages that social-engineer a postinstall prompt and exfiltrate
  raw wallet keys; and redeem-onchain-sdk impersonating a helper SDK
  (SSH, AWS, npm tokens, Docker, Chrome). Ten coordinated npm accounts
  and four delivery techniques.

