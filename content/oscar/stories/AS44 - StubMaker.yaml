      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: Malicious gems (and later npm twins) published to the registry.
      - techniqueID: T0151
        techName: Installation scripts
        tactic: Execution
        comment: extconf.rb runs at gem install and fetches the loader.
      - techniqueID: T0198
        techName: Malicious Build Time Dependencies
        tactic: Defense Evasion
