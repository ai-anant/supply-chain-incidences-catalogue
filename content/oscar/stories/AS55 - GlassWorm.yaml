summary: GlassWorm across GitHub, npm, Open VSX, VS Code, Python
description: |
  OpenSourceMalware reported GlassWorm compromising 430+ GitHub projects
  by using four ecosystems at once (GitHub, npm, Open VSX / VS Code,
  Python). Multi-ecosystem implants so cleaning one registry does not
  clear the campaign. Socket (2 Oct 2026) tied a VS Code theme cluster
  to the same loader: the Marketplace build of Cosmic Nebula Themes
  reused the previously documented Solana address, AES key, and eval
  model. Coca-Cola Christmas and Aurora Borealis Studio Theme shared
  the cluster's development artifacts; Marketplace removed the reported
  extensions after disclosure.

attacks:
  - attack: Multi-ecosystem implants
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0111
        techName: Malicious code contribution to an open-source repository
        tactic: Resource Development
        comment: 430+ GitHub projects in the blast radius.
      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: Parallel publishes to npm, Open VSX, and PyPI.
      - techniqueID: T0154
        techName: Malicious IDE extension
        tactic: Initial Access
        comment: Open VSX / VS Code as a delivery path.
      - techniqueID: T0169
        techName: Push implants across repositories
        tactic: Lateral Movement
        comment: Four ecosystems so remediation in one place is not enough.

