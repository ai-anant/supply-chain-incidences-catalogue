id: AS25
type: Attack Story
date: 2026-09
platforms:
  - npm

summary: indexed-btree runtime npm loader
description: |
  Checkmarx documented an npm campaign around indexed-btree (about 2 million
  weekly downloads, impersonating sorted-btree) whose package.json had no
  install scripts. The loader lives in BTree.prototype.set and fires when
  the application uses the library (key == 100). Stage-1 fingerprints the
  host and beacons Slack/Telegram; C2 is an Ethereum Sepolia contract;
  stage-2 is X25519/ECDH-unwrapped on-chain. Nine sibling packages reached
  366k–1.95M downloads. Blocking lifecycle scripts only moved the payload
  from install time to import time. ReversingLabs (6 Oct 2026) recapped
  the same package and said the command-and-control infrastructure was
  still running.

attacks:
  - attack: npm indexed-btree and siblings
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0129
        techName: Typosquatting
        tactic: Initial Access
        comment: Impersonated the legitimate sorted-btree library.
      - techniqueID: T0141
        techName: Fake developer reputation (Starjacking)
        tactic: Resource Development
        comment: |
          A legitimate-looking GitHub repo with fabricated commit history;
          the repo never contained the malicious code.
      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: indexed-btree plus nine siblings were published to npm.
      - techniqueID: T0159
        techName: Malicious artifact execution
        tactic: Execution
        comment: |
          Execution was on library use, not on npm install — npm v12's
          install-script block never saw it.
      - techniqueID: T0176
        techName: Disable or misconfigure security measures
        tactic: Defense Evasion
        comment: |
          The malware could delete its files and strip the trigger from the
          prototype after running.

gaps:
  - Runtime-hidden loaders that skip install hooks are still modeled as T0159 rather than a dedicated technique.

links:
  - https://checkmarx.com/zero-post/npm-btree-malware-campaign-affects-millions-of-downloads-no-need-for-install-script/
  - https://www.reversinglabs.com/blog/npm-dependency-installation-security-measure-defeated
