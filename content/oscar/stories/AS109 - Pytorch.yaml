id: AS109
type: Attack Story
date: 2022-12
platforms:
  - pypi

summary: PyTorch-nightly torchtriton dependency confusion
description: |
  Between 25 and 30 December 2022, Linux pip installs of PyTorch-nightly
  pulled a malicious torchtriton from PyPI instead of the namesake package
  on PyTorch’s own index, because PyPI takes precedence. The extra binary
  stole environment variables and files from the home directory. Stable
  PyTorch packages were not affected. PyTorch’s own advisory is the
  primary record; they replaced the dependency with pytorch-triton and
  registered a dummy on PyPI. The inherited mapping treated this as T0113
  (compromised user account); it is T0120.

attacks:
  - attack: torchtriton on PyPI
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0120
        techName: Dependency confusion
        tactic: Initial Access
        comment: Same name as the internal nightly dependency; PyPI won the resolve.
      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: Malicious torchtriton uploaded to the public index.
      - techniqueID: T0107
        techName: Discover internal artifacts names
        tactic: Reconnaissance
        comment: The attacker needed the unpublished name torchtriton.
  - attack: PyTorch-nightly users
    index: 2
    stage: post-supply-chain
    customer: 1
    supplier: 0
    techniques:
      - techniqueID: T0151
        techName: Installation scripts
        tactic: Execution
        comment: pip install of nightly pulled and ran the malicious wheel.
      - techniqueID: T0140
        techName: Harvest tokens from environment variables
        tactic: Credential Access
        comment: Env vars and home-directory files were exfiltrated.
      - techniqueID: T0201
        techName: Customers compromised
        tactic: Impact
        comment: Anyone who pip-installed Linux nightly in that five-day window.

links:
  - https://pytorch.org/blog/compromised-nightly-dependency/
