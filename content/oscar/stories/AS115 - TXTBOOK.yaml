summary: TXTBOOK dependency confusion against Tinkoff / T-Bank
description: 'CloudSEK tracks TXTBOOK: 993 public npm packages (after a PyPI start)

  reconstructing Tinkoff / T-Bank internal names (BNPL, business banking,

  analytics). The second-stage loader resolves the bank’s internal

  artifact repository and proceeds only if it answers — so it runs inside

  the target network. Delivery reassembles a Sliver implant from several

  hundred DNS TXT records instead of an HTTP download.

  '
