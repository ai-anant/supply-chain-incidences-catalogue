id: AS1
type: Attack Story
date: 2018-04
platforms:
  - linux
  - workstation

summary: Webmin 1.890–1.920 build-server backdoor
description: |
  In April 2018 an attacker exploited the Webmin development build server and
  injected a concealed remote-command backdoor into password_change.cgi. The
  change was taken from the local build tree, not from a controlled SCM, so
  source review of git would not have seen it. Versions 1.890 shipped an
  immediately exploitable root RCE; 1.900–1.920 still contained similar code
  that became exploitable if “allow changing of expired passwords” was on.
  In September 2018 the old build server was replaced, but the modified
  directory was copied from backups and the backdoor returned. This was
  deliberate, not an accidental bug. Tracked as CVE-2019-15107 / CVE-2019-15231.

attacks:
  - attack: Webmin build pipeline
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0180
        techName: Compromise services / servers
        tactic: Initial Access
        comment: The development build server was exploited in April 2018.
      - techniqueID: T0135
        techName: Vulnerable CICD system
        tactic: Initial Access
        comment: |
          Infected code was taken from the local build tree, not from SCM.
      - techniqueID: T0194
        techName: Outdated software components
        tactic: Initial Access
        comment: |
          The replacement CentOS 7 build host reused a backup of the poisoned
          build directory, so the backdoor survived the “rebuild.”
      - techniqueID: T0138
        techName: Backdoor in code
        tactic: Persistence
        comment: Non-obvious RCE planted in password_change.cgi.
      - techniqueID: T0191
        techName: Malicious code in artifacts
        tactic: Impact
        comment: Released Webmin tarballs carried the backdoor to operators.
  - attack: Webmin customers
    index: 2
    stage: post-supply-chain
    customer: 1
    supplier: 0
    techniques:
      - techniqueID: T0172
        techName: Runtime backdoor
        tactic: Execution
        comment: Root RCE for anyone who knew the trigger, on default 1.890.
      - techniqueID: T0201
        techName: Customers compromised
        tactic: Impact
        comment: Any server that installed the backdoored Webmin package.

