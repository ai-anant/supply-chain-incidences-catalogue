  - attack: Malicious Go modules and fake ecosystems
    index: 2
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0108
        techName: Accounts in public registry
        tactic: Resource Development
        comment: Modules gocommunity.io/orderedbtree and gogets.dev/btreex under attacker vanity paths.
      - techniqueID: T0141
        techName: Fake developer reputation (Starjacking)
        tactic: Resource Development
        comment: gocommunity.io and gogets.dev look like Go package ecosystems; they do not accept third-party packages.
      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: orderedbtree (11 Aug, plaintext malware) and btreex (8 Sep, malware in a fake .sql).
      - techniqueID: T0195
        techName: Spoofed Commits
        tactic: Defense Evasion
        comment: Forged commits backdated to Nov 2025 so the Go module proxy showed a false release date.
      - techniqueID: T0150
        techName: Runtime logic bomb
        tactic: Execution
        comment: btreex activates only when processing an object with one specific price integer.
      - techniqueID: T0159
        techName: Malicious artifact execution
        tactic: Execution
        comment: Same Graphalgo Go RAT as the Terraform providers.
      - techniqueID: T0172
        techName: Runtime backdoor
        tactic: Execution
        comment: Shared Slack workspaces and Ethereum key with April npm Graphalgo.

gaps:
  - Slack workspace plus Arbitrum smart-contract C2 is not a named technique.
  - Standing up fake vanity Go ecosystems as social-engineering fronts is only partly covered by T0141.

