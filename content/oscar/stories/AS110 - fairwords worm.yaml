summary: "@fairwords credential worm"
description: |
  SafeDep: three @fairwords npm packages were compromised with a
  self-propagating worm that harvests credentials, crypto wallets, and
  Chrome passwords. Same worm class as Shai-Hulud / ChainDrop, scoped
  to that publisher.

