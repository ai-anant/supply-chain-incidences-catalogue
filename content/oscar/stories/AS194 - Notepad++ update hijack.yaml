id: AS194
type: Attack Story
date: 2025-06
platforms:
  - windows
  - update-channel

summary: Notepad++ update-server hijack (Jun–Dec 2025)
description: |
  GTIG attributes UNC6688 to a compromise of hosting infrastructure
  serving Notepad++ updates from June to December 2025. First-party
  incident note from the Notepad++ project. Traditional update-channel
  supply chain (same class as CCleaner/ShadowHammer), not a language
  registry.

attacks:
  - attack: update origin
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0209
        techName: Compromise package registry or CDN origin
        tactic: Initial Access
        comment: Hijacked Notepad++ update hosting.
      - techniqueID: T0121
        techName: Compromised legitimate artifact
        tactic: Resource Development
        comment: Official updater delivered attacker code.

